services:
  db:
    profiles: [sqlserver]

  secureshare-api:
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Sqlite
      ConnectionStrings__DefaultConnection: "Data Source=/app/Data/secureshare.db;Default Timeout=30"
      Database__MigrateOnStartup: "false"
      DataProtection__CertificatePath: /run/secrets/protection.pfx
      DataProtection__CertificatePasswordFile: /run/secrets/protection-password
      ReverseProxy__KnownProxies__0: 172.29.50.2
      HTTPS_PORT: "443"
    volumes:
      - ./secrets/protection.pfx:/run/secrets/protection.pfx:ro
      - ./secrets/protection-password:/run/secrets/protection-password:ro
      - sqlite_data:/app/Data
    depends_on: !override
      volume-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    networks: [default, edge]

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.29.50.2
    restart: unless-stopped
    depends_on: [secureshare-api]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.29.50.0/24

volumes:
  caddy_data:
  caddy_config:
  sqlite_data:
