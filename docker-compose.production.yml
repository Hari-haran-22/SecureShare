services:
  db:
    profiles: [sqlserver]

  secureshare-api:
    # Port 8080 is reachable only inside the VPC security group. Caddy still
    # serves all public traffic over HTTPS.
    ports: !override ["0.0.0.0:8080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Provider: Sqlite
      ConnectionStrings__DefaultConnection: "Data Source=/app/Data/secureshare.db;Default Timeout=30"
      Database__MigrateOnStartup: "false"
      Scanner__Host: ${SCANNER_HOST:-clamav}
      DataProtection__CertificatePath: /run/secrets/protection.pfx
      DataProtection__CertificatePasswordFile: /run/secrets/protection-password
      ReverseProxy__KnownProxies__0: 172.29.50.2
      HTTPS_PORT: "443"
    volumes:
      - ./secrets/protection.pfx:/run/secrets/protection.pfx:ro
      - ./secrets/protection-password:/run/secrets/protection-password:ro
      - sqlite_data:/app/Data
    depends_on: !override
      volume-init:
        condition: service_completed_successfully
    networks:
      default: {}
      edge:
        ipv4_address: 172.29.50.3

  clamav:
    profiles: [services]
    ports: ["0.0.0.0:3310:3310"]

  prometheus:
    profiles: [services]
    volumes: !override
      - ./deploy/prometheus-runtime.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  alertmanager:
    profiles: [services]

  grafana:
    profiles: [services]

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your public hostname in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.29.50.2
    restart: unless-stopped
    depends_on: [secureshare-api]

networks:
  edge:
    ipam:
      config:
        - subnet: 172.29.50.0/24

volumes:
  caddy_data:
  caddy_config:
  sqlite_data:
