groups:
  - name: secureshare
    rules:
      - alert: SecureShareDown
        expr: up{job="secureshare-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SecureShare API cannot be scraped
      - alert: SecureShareServerErrors
        expr: sum(rate(http_requests_received_total{code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_received_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of API requests are failing
      - alert: SecureShareCleanupStalled
        expr: time() - secureshare_cleanup_last_success_seconds > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Expired file cleanup has stopped
      - alert: SecureShareStorageHigh
        expr: secureshare_stored_bytes > 4294967296
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Storage exceeds 80% of the default quota
      - alert: HostCpuHigh
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host CPU usage is above 85 percent
      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host memory usage is above 85 percent
      - alert: HostDiskHigh
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Host filesystem usage is above 85 percent
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Node Exporter cannot be scraped
